<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 335" role="img" aria-label="CH₃OH · keep the three charge descriptions separate"><title>CH₃OH · keep the three charge descriptions separate</title><rect width="720" height="335" rx="12" fill="#f8fbff"/><g font-family="Arial, sans-serif"><text x="360" y="35" font-size="23" fill="#142750" text-anchor="middle">CH₃OH · keep the three charge descriptions separate</text><text x="250" y="115" font-size="32" fill="#142750" text-anchor="middle">CH₃</text><text x="380" y="115" font-size="32" fill="#142750" text-anchor="middle">O</text><text x="500" y="115" font-size="32" fill="#142750" text-anchor="middle">H</text><line x1="288" y1="104" x2="355" y2="104" stroke="#142750" stroke-width="2.5"/><line x1="405" y1="104" x2="476" y2="104" stroke="#142750" stroke-width="2.5"/><circle cx="376" cy="72" r="2.5" fill="#142750"/><circle cx="384" cy="72" r="2.5" fill="#142750"/><circle cx="376" cy="133" r="2.5" fill="#142750"/><circle cx="384" cy="133" r="2.5" fill="#142750"/><text x="360" y="188" font-size="18" fill="#142750" text-anchor="middle">Oxidation states: C −2  |  O −2  |  each H +1</text><text x="360" y="225" font-size="18" fill="#142750" text-anchor="middle">Formal charges: every atom 0</text><text x="360" y="262" font-size="17" fill="#142750" text-anchor="middle">Course partial-charge approximation: C ≈ 0  |  O δ−  |  H δ+</text><text x="360" y="305" font-size="18" fill="#142750" text-anchor="middle">Partial charge depends on electron distribution; it is not formal charge.</text></g></svg>