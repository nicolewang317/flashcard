="149" r="2.5" fill="#142750"/><text x="230" y="283" font-size="19" fill="#142750" text-anchor="middle">NH₄⁺: full ion charge +1</text><text x="551" y="283" font-size="19" fill="#142750" text-anchor="middle">Cl⁻: full ion charge −1</text><text x="360" y="322" font-size="18" fill="#142750" text-anchor="middle">N: formal +1, oxidation −3; H: formal 0, oxidation +1.</text><text x="360" y="354" font-size="18" fill="#142750" text-anchor="middle">N–H bond polarity: N δ−, H δ+ (course convention).</text><text x="360" y="385" font-size="16" fill="#142750" text-anchor="middle">Connectivity sketch; tetrahedral NH₄⁺ is not square planar.</text></g></svg>